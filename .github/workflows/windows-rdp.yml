name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        # Create a new user 'admin' with a password
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"

        # Add the user to the Administrators group
        Add-LocalGroupMember -Group "Administrators" -Member "admin"

        # Enable RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # Disable Network Level Authentication
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

        Write-Host "User created and RDP enabled successfully."

    - name: Create TCP Tunnel (localhost.run)
      shell: pwsh
      run: |
        Write-Host "Starting localhost.run tunnel..."
        
        # Ensure SSH Client is installed
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null

        # Start SSH tunnel in background. -N means no command, -T disables TTY, -R forwards.
        # We use -o ExitOnForwardFailure=no to allow the script to move on.
        $process = Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=60", "-o", "ExitOnForwardFailure=no", "-R", "3389:localhost:3389", "-N", "-T", "nokey@localhost.run" -RedirectStandardOutput "tunnel_out.txt" -RedirectStandardError "tunnel_err.txt" -PassThru -WindowStyle Hidden
        
        # Wait for the tunnel to establish
        Start-Sleep -Seconds 30
        
        Write-Host "TUNNEL OUTPUT (Look for the PORT):"
        Get-Content "tunnel_out.txt"
        Get-Content "tunnel_err.txt"
        Write-Host "======================================"

    - name: Get Credentials
      shell: pwsh
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
        Write-Host "======================================"
        Write-Host "RDP IS READY!"
        Write-Host "YOUR SERVER IP (for reference): $ip"
        Write-Host "YOUR PUBLIC TUNNEL IS IN THE LOGS ABOVE"
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
        Write-Host "======================================"
