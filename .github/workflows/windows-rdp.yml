name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"
        Add-LocalGroupMember -Group "Administrators" -Member "admin"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Write-Host "User created and RDP enabled successfully."

    - name: Start Cloudflared Quick Tunnel
      shell: pwsh
      run: |
        Write-Host "Downloading Cloudflared (Official Cloudflare Link)..."
        
        # This is the official, stable, direct download link
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        
        Write-Host "Successfully downloaded. Starting tunnel..."
        
        # Start the tunnel in the background
        $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:3389" -RedirectStandardOutput "cf_out.txt" -RedirectStandardError "cf_err.txt" -PassThru -WindowStyle Hidden
        
        # Wait for the tunnel to establish
        Start-Sleep -Seconds 30
        
        Write-Host "================ CLOUDFLARE LOGS ================"
        Get-Content "cf_out.txt"
        Get-Content "cf_err.txt"
        Write-Host "=================================================="
        
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
