name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        Write-Host "Setting up virtual environment..."
        net user runner "P@ssw0rd123!" /add
        net localgroup administrators runner /add
        Write-Host "User created."

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Write-Host "RDP enabled."

    - name: Install Software
      run: |
        choco install googlechrome 7zip notepadplusplus -y
        Write-Host "Software installed."

    - name: Get IP and Generate Info
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
        Write-Host "======================================"
        Write-Host "INSTANCE NUMBER: ${{ github.event.inputs.instance_number }}"
        Write-Host "IP ADDRESS: $ip"
        Write-Host "USERNAME: runner"
        Write-Host "PASSWORD: P@ssw0rd123!"
        Write-Host "======================================"
