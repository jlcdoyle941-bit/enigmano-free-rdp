name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"
        Add-LocalGroupMember -Group "Administrators" -Member "admin"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Write-Host "User created and RDP enabled successfully."

    - name: Start Serveo Tunnel with Loop
      shell: pwsh
      run: |
        Write-Host "Attempting to start Serveo tunnel..."
        
        # Check if SSH Client is installed
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null

        # Start tunnel in background
        $process = Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=60", "-R", "3389:localhost:3389", "-N", "-T", "serveo.net" -RedirectStandardOutput "serveo_out.txt" -RedirectStandardError "serveo_err.txt" -PassThru -WindowStyle Hidden
        
        Write-Host "Waiting for tunnel to establish..."
        Start-Sleep -Seconds 30
        
        # Read the output
        $output = Get-Content "serveo_out.txt"
        $err = Get-Content "serveo_err.txt"
        
        Write-Host "================ OUTPUT ================"
        Write-Output $output
        Write-Output $err
        Write-Host "========================================"
        
        # Extract the public URL
        if ($err -match "(\w+\.serveo\.net)") {
            $url = $matches[1]
            Write-Host "======================================"
            Write-Host "RDP IS READY!"
            Write-Host "ENTER THIS IN RDP APP: $url"
            Write-Host "USERNAME: admin"
            Write-Host "PASSWORD: P@ssw0rd123!"
            Write-Host "======================================"
        } else {
            Write-Host "No URL found yet. Trying to read again in 10 seconds..."
            Start-Sleep -Seconds 10
            $err = Get-Content "serveo_err.txt"
            if ($err -match "(\w+\.serveo\.net)") {
                $url = $matches[1]
                Write-Host "======================================"
                Write-Host "RDP IS READY!"
                Write-Host "ENTER THIS IN RDP APP: $url"
                Write-Host "USERNAME: admin"
                Write-Host "PASSWORD: P@ssw0rd123!"
                Write-Host "======================================"
            } else {
                Write-Host "Tunnel failed. Please check the output above."
            }
        }
