name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        # Create a new user 'admin' with a password
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"

        # Add the user to the Administrators group
        Add-LocalGroupMember -Group "Administrators" -Member "admin"

        # Enable RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # Disable Network Level Authentication
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

        Write-Host "User created and RDP enabled successfully."

    - name: Create Serveo Tunnel
      shell: pwsh
      run: |
        Write-Host "Starting Serveo Tunnel..."
        
        # Check if SSH is available
        $sshPath = Get-Command ssh -ErrorAction SilentlyContinue
        if (-not $sshPath) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
        }

        # Create a file to automatically accept host keys
        "StrictHostKeyChecking no" | Out-File -FilePath "ssh_config.txt" -Encoding ascii

        # Start Serveo in the background, redirecting output
        $process = Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "ServerAliveInterval=60", "-R", "3389:localhost:3389", "serveo.net" -RedirectStandardOutput "serveo_out.txt" -RedirectStandardError "serveo_err.txt" -PassThru -WindowStyle Hidden
        
        # Wait for the connection to establish
        Start-Sleep -Seconds 25
        
        Write-Host "SERVEO OUTPUT:"
        Get-Content "serveo_out.txt"
        Get-Content "serveo_err.txt"
        Write-Host "======================================"

    - name: Get Credentials
      shell: pwsh
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
        Write-Host "======================================"
        Write-Host "RDP IS READY!"
        Write-Host "YOUR SERVER IP (for reference): $ip"
        Write-Host "YOUR PUBLIC TUNNEL IS IN THE LOGS ABOVE"
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
        Write-Host "======================================"
