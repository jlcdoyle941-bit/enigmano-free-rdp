name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"
        Add-LocalGroupMember -Group "Administrators" -Member "admin"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Write-Host "User created and RDP enabled successfully."

    - name: Create TCP Tunnel (Bypass Port 3389)
      shell: pwsh
      run: |
        Write-Host "Starting tunnel on high port 13389..."
        
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null

        # Map external port 13389 to internal port 3389
        $process = Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=60", "-o", "ExitOnForwardFailure=no", "-R", "13389:localhost:3389", "-N", "-T", "nokey@localhost.run" -RedirectStandardOutput "tunnel_out.txt" -RedirectStandardError "tunnel_err.txt" -PassThru -WindowStyle Hidden
        
        Start-Sleep -Seconds 30
        
        Write-Host "TUNNEL OUTPUT:"
        Get-Content "tunnel_out.txt"
        Get-Content "tunnel_err.txt"
        Write-Host "======================================"

    - name: Get Credentials
      shell: pwsh
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
        Write-Host "======================================"
        Write-Host "RDP IS READY!"
        Write-Host "YOUR SERVER IP (for reference): $ip"
        Write-Host "YOUR PUBLIC TUNNEL IS IN THE LOGS ABOVE"
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
        Write-Host "======================================"
