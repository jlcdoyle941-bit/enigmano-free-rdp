name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"
        Add-LocalGroupMember -Group "Administrators" -Member "admin"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Write-Host "RDP Enabled successfully."

    - name: Download LocalXpose and Start TCP Tunnel
      shell: pwsh
      run: |
        Write-Host "Downloading LocalXpose..."
        
        # Download LocalXpose (using the official direct link)
        try {
            Invoke-WebRequest -Uri "https://api.localxpose.io/api/v2/downloads/localxpose_windows_amd64.zip" -OutFile "localxpose.zip"
        } catch {
            # Fallback to GitHub if the API fails
            Invoke-WebRequest -Uri "https://github.com/localxpose/localxpose/releases/latest/download/localxpose_windows_amd64.zip" -OutFile "localxpose.zip"
        }
        
        Expand-Archive -Path "localxpose.zip" -DestinationPath "."
        
        Write-Host "Starting TCP tunnel on port 3389..."
        
        # Start the tunnel in the background (No token required)
        $process = Start-Process -FilePath ".\localxpose.exe" -ArgumentList "tcp 3389" -RedirectStandardOutput "lx_out.txt" -RedirectStandardError "lx_err.txt" -PassThru -WindowStyle Hidden
        
        # Wait for it to connect
        Start-Sleep -Seconds 25
        
        Write-Host "================ LOCALXPOSE OUTPUT ================"
        Get-Content "lx_out.txt"
        Get-Content "lx_err.txt"
        Write-Host "==================================================="
        
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
