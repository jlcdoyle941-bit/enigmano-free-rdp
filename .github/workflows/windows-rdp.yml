name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup User and Enable RDP
      shell: pwsh
      run: |
        # Create a new user 'admin' with a password
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        New-LocalUser -Name "admin" -Password $Password -FullName "Admin" -Description "Admin User"

        # Add the user to the Administrators group
        Add-LocalGroupMember -Group "Administrators" -Member "admin"

        # Enable RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # Disable Network Level Authentication
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

        Write-Host "User created and RDP enabled successfully."

    - name: Install OpenSSH Client and Create Tunnel
      shell: pwsh
      run: |
        # Add Windows OpenSSH Client (usually already installed)
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
        
        Write-Host "Starting Tunnel..."
        
        # Use plink (PuTTY) to create a reverse tunnel to localhost.run
        # Downloading plink first
        Invoke-WebRequest -Uri "https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe" -OutFile "plink.exe"
        
        # Create a simple file to answer 'yes' to host key prompts
        "y`n" | Out-File -FilePath "answer.txt" -Encoding ascii
        
        # Start the tunnel in the background and capture the output
        $process = Start-Process -FilePath ".\plink.exe" -ArgumentList "-ssh -R 3389:localhost:3389 -N -T nokey@localhost.run" -RedirectStandardOutput "tunnel.txt" -RedirectStandardError "tunnel_err.txt" -PassThru -WindowStyle Hidden
        
        # Wait for the tunnel to establish
        Start-Sleep -Seconds 20
        
        Write-Host "TUNNEL ADDRESS (Copy this):"
        Get-Content "tunnel.txt"
        Get-Content "tunnel_err.txt"

    - name: Get Credentials
      shell: pwsh
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
        Write-Host "======================================"
        Write-Host "RDP IS READY!"
        Write-Host "YOUR PUBLIC TUNNEL IS IN THE LOGS ABOVE"
        Write-Host "LOCAL IP: $ip"
        Write-Host "USERNAME: admin"
        Write-Host "PASSWORD: P@ssw0rd123!"
        Write-Host "======================================"
